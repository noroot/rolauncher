[package]
name = "rolauncher"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A lightweight, native macOS application launcher"

[dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
